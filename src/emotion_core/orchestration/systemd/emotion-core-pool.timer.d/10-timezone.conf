# 2026-09-29 追加：与 emotion-core-daily.timer.d/10-timezone.conf 同因同解。
# 本机时区 Etc/UTC，仓内 .timer 里裸写的 `OnCalendar=Mon-Fri 17:45` 会在
# **09:45 北京时间**触发——早于 daily（17:20 CST）跑完，EM 池是收盘后的当日
# 快照，半日数据会被当收盘数据写进 limit_pool_em。
# 两点必须照抄 daily 的教训：
#  ① OnCalendar 是**列表属性**，必须先 `OnCalendar=` 置空重置，否则新旧两条全触发；
#  ② 单写 [Timer] Timezone= 在本机 systemd 259 上**不生效**，时区必须写进表达式。
# 校验：systemd-analyze calendar "Mon-Fri 17:45 Asia/Shanghai"
[Timer]
OnCalendar=
OnCalendar=Mon-Fri 17:45 Asia/Shanghai
Persistent=true
