# 2026-09-29 追加：与 emotion-core-daily.timer.d/10-timezone.conf 同因同解。
# 本机时区 Etc/UTC，仓内 .timer 里裸写的 `OnCalendar=Mon-Fri 18:00` 会在
# **10:00 北京时间**触发——那会儿 A 股还在盘中，EM 池的当日数据尚未成形，
# 报告会对账出一个「假差异」，并把当日数据可信度标成 UNKNOWN。
# 两点必须照抄 daily 的教训：
#  ① OnCalendar 是**列表属性**，必须先 `OnCalendar=` 置空重置，否则新旧两条全触发；
#  ② 单写 [Timer] Timezone= 在本机 systemd 259 上**不生效**，时区必须写进表达式。
# 校验：systemd-analyze calendar "Mon-Fri 18:00 Asia/Shanghai"
[Timer]
OnCalendar=
OnCalendar=Mon-Fri 18:00 Asia/Shanghai
Persistent=true
