# 2026-09-29 追加：与 emotion-core-daily.timer.d/10-timezone.conf 同因同解。
# 本机时区 Etc/UTC，仓内 .timer 里裸写的 `OnCalendar=Mon-Fri 18:05` 会在
# **10:05 北京时间**触发、08:50 那条会在 16:50 触发——两拍都落空
# （既不在主链之后，又不在盘前）。
# 两点必须照抄 daily 的教训：
#  ① OnCalendar 是**列表属性**，必须先 `OnCalendar=` 置空重置，否则 3 个时刻全触发；
#     本单元原本有 2 条（18:05、08:50），置空后只保留下面 2 条的北京时间版本。
#  ② 单写 [Timer] Timezone= 在本机 systemd 259 上**不生效**，时区必须写进表达式。
#     校验：systemd-analyze calendar "Mon-Fri 18:05 Asia/Shanghai"
[Timer]
OnCalendar=
OnCalendar=Mon-Fri 18:05 Asia/Shanghai
OnCalendar=Mon-Fri 08:50 Asia/Shanghai
Persistent=true
