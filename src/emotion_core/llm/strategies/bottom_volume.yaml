# Bottom Volume Surge Strategy / 底部放量
# After extended decline, price stabilizes and volume spikes. Potential reversal.

name: bottom_volume
display_name: 底部放量
description: 检测长期下跌后底部放量信号，潜在趋势反转信号。
category: reversal
core_rules: [2, 5]
aliases: [地量见底, 底部放量]
default_priority: 60
market_regimes: [trending_down]

instructions: |
  **底部放量（Bottom Volume Surge Strategy）**

  反转判定标准：

  1. **持续下跌确认**：
     - 使用 `数据上下文（近20日日线：开高低收、涨幅、成交量、换手率、一字标记）`（30日）。
     - 股价从 20 日高点到近期低点跌幅 > 15%。
     - `数据上下文中的趋势指标` → trend_status 应为 BEAR 或 STRONG_BEAR。

  2. **量能异动**：
     - 当日成交量 > 5 日均量的 3 倍。
     - 使用 `数据上下文中的当日行情` → volume_ratio > 3.0。
     - 该异动应出现在前期极度缩量之后。

  3. **价格企稳**：
     - 当日K线收阳（收盘价 > 开盘价）。
     - 价格守住近期低点。
     - 最好出现长下影线，显示买方支撑。

  4. **确认因素**（关联理念5：风险排查）：
     - 筹码分布：平均成本接近现价（成本收敛）。

  5. **风险提示**（关联理念2：趋势交易）：
     - 这是反转信号，风险高于趋势跟踪。
     - 仓位建议较小（最多 2-3 成）。
     - 止损必须严格（设在近期低点下方）。

  评分调整：
  - 底部放量确认：sentiment_score +8
  - 配合阳线 + 量能确认：额外 +5
  - 在 `buy_reason` 和 `pattern_analysis` 中注明"底部放量"。
  - 止损设在近期低点。
